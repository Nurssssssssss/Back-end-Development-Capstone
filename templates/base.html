{% load static %}
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbound — Band and Concerts</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#ecf4ff;background:#07111e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 40% -10%,#20355c 0%,#07111e 65%)}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px max(5vw,20px);border-bottom:1px solid #ffffff22;flex-wrap:wrap;gap:14px;background:#080f1fc7}
.logo{font-weight:900;font-size:25px;letter-spacing:-.06em;color:#fff}.logo span{color:#89fbce}
.links{display:flex;flex-wrap:wrap;gap:20px}.links a{color:#b8c7dc;text-decoration:none;font-size:14px}.links a:hover{color:white}
main{max-width:1110px;margin:45px auto;padding:0 20px;min-height:70vh}
h1{font-size:clamp(36px,6vw,68px);letter-spacing:-.06em;line-height:1.07;margin:10px 0 20px}
h2{font-size:36px;letter-spacing:-.04em;margin:8px 0 16px}
.lede{color:#aabbd3;font-size:17px;max-width:650px;line-height:1.6}.eyebrow{color:#79dbb6;letter-spacing:.16em;font-weight:800;font-size:12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:27px}
.card{background:linear-gradient(140deg,#18273c,#101c2c);border:1px solid #394a62;border-radius:16px;padding:24px;min-height:130px}
.card h3{font-size:20px;margin:4px 0 10px}.muted{color:#aac0d6}.card img{width:100%;height:205px;object-fit:cover;border-radius:10px;background:#2d435d}
button,.button{border:0;border-radius:9px;background:#7fe4bd;color:#082119;padding:10px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
button:hover,.button:hover{background:#9af5d2}
dialog{border:1px solid #4b617a;border-radius:16px;background:#132338;color:white;width:min(480px,90vw);box-shadow:0 28px 100px #0009;padding:30px}
dialog::backdrop{background:#020714ba}footer{color:#7890aa;text-align:center;padding:28px}
.tag{display:inline-block;border:1px solid #2c876f;color:#8de3c0;padding:5px 9px;border-radius:6px;font-size:12px}
</style></head>
<body><nav><a href="/" class="logo">NORTH<span>BOUND.</span></a><div class="links">
<a href="/">Home</a><a href="/songs/">Songs</a><a href="/photos/">Photos</a><a href="/concerts/">Concerts</a><a href="/admin/">Admin</a>
</div></nav><main>{% block content %}{% endblock %}</main><footer>Northbound · Capstone demo · Flask + Django + MongoDB<br><small>Page URL: {{ request.build_absolute_uri }}</small></footer></body></html>
