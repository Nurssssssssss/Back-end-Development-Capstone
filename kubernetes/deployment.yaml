apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-capstone
spec:
  replicas: 1
  selector:
    matchLabels: {app: django-capstone}
  template:
    metadata:
      labels: {app: django-capstone}
    spec:
      containers:
      - name: web
        image: REPLACE_WITH_YOUR_PUBLIC_DOCKER_IMAGE
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_DEBUG
          value: "0"
        - name: DJANGO_ALLOWED_HOSTS
          value: "YOUR_HOSTNAME,localhost,127.0.0.1"
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: django-secret, key: secret-key}
---
apiVersion: v1
kind: Service
metadata:
  name: django-capstone
spec:
  selector: {app: django-capstone}
  ports:
  - port: 80
    targetPort: 8000
