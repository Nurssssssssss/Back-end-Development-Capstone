name: Django CI and local-screenshot evidence
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate | tee django-migrate.txt
      - run: python manage.py seed_demo
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - name: Build Django Docker image
        run: docker build --progress=plain -t django-capstone:ci . 2>&1 | tee deploy-getdjango-1.txt
      - run: python manage.py runserver 0.0.0.0:8000 > django-runserver.log 2>&1 &
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/capture_browser_evidence.py --base http://localhost:8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-django-evidence
          path: |
            deploy-getdjango-1.txt
            django-migrate.txt
            django-runserver.log
            evidence/*.jpg
            evidence/*.png
